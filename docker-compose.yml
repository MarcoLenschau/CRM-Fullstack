
services:
  mongodb:
    image: mongo:7.0
    container_name: nestjs-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "0123456789"

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
